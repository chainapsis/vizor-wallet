[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
    "wallet-example",
]
# The default root build is the Zakura application path. LRZ and the
# lower-level VCT packages are validated in separate invocations because their
# backend features are mutually exclusive within one Cargo resolve.
default-members = [
    "zcash_voting",
    "wallet-example",
]
resolver = "2"

[workspace.dependencies]
voting-circuits = { version = "=0.11.2", default-features = false }
voting-crypto-deps = { version = "=0.2.2", default-features = false }
zcash_protocol = { version = "0.10.4" }

[profile.test.package.imt-tree]
opt-level = 3

[profile.test.package.valar-ypir]
opt-level = 3

[profile.test.package.valar-spiral-rs]
opt-level = 3
