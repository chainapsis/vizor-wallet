# The plain scan and decrypt entry points never try the wallet's swap receiving keys,
# and the wallet store refuses their results while a swap key is open.
disallowed-methods = [
    { path = "zcash_client_backend::data_api::chain::scan_cached_blocks", reason = "use scan_cached_blocks_with_swap_keys, which also tries the wallet's swap keys" },
    { path = "zcash_client_backend::data_api::wallet::decrypt_and_store_transaction", reason = "use decrypt_and_store_transaction_with_swap_keys, which also tries the wallet's swap keys" },
]
