# The plain scan and decrypt entry points never try the wallet's one-time IVKs, and
# the wallet store refuses their results while a one-time IVK is open.
disallowed-methods = [
    { path = "zcash_client_backend::data_api::chain::scan_cached_blocks", reason = "use scan_cached_blocks_with_one_time_ivks, which also tries the wallet's one-time IVKs" },
    { path = "zcash_client_backend::data_api::wallet::decrypt_and_store_transaction", reason = "use decrypt_and_store_transaction_with_one_time_ivks, which also tries the wallet's one-time IVKs" },
]
