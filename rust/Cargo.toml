[package]
name = "rust_lib_zcash_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
zakura-pir-protocol = { version = "=0.0.1-rc5", default-features = false, features = ["http-endpoint"] }
zakura-pir-config = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-service-config = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-pir-client = { version = "=0.0.1-rc5", default-features = false, features = ["enhance", "status", "transparent", "wallet", "sqlite", "lightwalletd"] }
zcash_note_encryption = { package = "zakura-note-encryption", version = "=5.0.0", git = "https://github.com/zakura-core/common.git", rev = "26fb46d9110092f07cc682f16d4678b01fb915df" }
flutter_rust_bridge = "=2.11.1"

zcash_script = { package = "zakura-zcash-script", version = "=0.0.1", git = "https://github.com/zakura-core/common.git", rev = "26fb46d9110092f07cc682f16d4678b01fb915df" }
voting-crypto-deps = "=0.4.0"
sapling-crypto = { package = "zakura-sapling-crypto", version = "=5.0.0", git = "https://github.com/zakura-core/common.git", rev = "26fb46d9110092f07cc682f16d4678b01fb915df", default-features = false, features = ["circuit"] }
uuid = "1.1"
zip32 = "0.2"
pasta_curves = { package = "zakura-pasta-curves", version = "=5.0.0", git = "https://github.com/zakura-core/common.git", rev = "26fb46d9110092f07cc682f16d4678b01fb915df" }
ff = "0.14"
# Required by no-op Sapling prover trait impls
jubjub = { package = "zakura-jubjub", version = "=5.0.0", git = "https://github.com/zakura-core/common.git", rev = "26fb46d9110092f07cc682f16d4678b01fb915df" }
bls12_381 = { package = "zakura-bls12-381", version = "=5.0.0", git = "https://github.com/zakura-core/common.git", rev = "26fb46d9110092f07cc682f16d4678b01fb915df" }
rand_core = "0.6"
secp256k1 = "0.33"

# Key generation
bip0039 = "0.12"

# Serialization
nonempty = "0.11"
minicbor = "0.19"
prost = "0.14"
incrementalmerkletree = "0.8"
shardtree = "0.7"

# Security
secrecy = "0.8"
zeroize = "1"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
base64 = "0.22"
pbkdf2 = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

# Random number generation
rand = "0.8"

# Async runtime & gRPC
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
tonic = { version = "0.14", features = ["channel", "tls-webpki-roots", "tls-ring"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
tower-service = "0.3"
time = "0.3"
# rustls is in the graph transitively via tonic; make it a direct dep
# so we can explicitly install the ring CryptoProvider in `init_app`.
# Without an explicit provider install, rustls 0.23+ panics the first
# TLS handshake with "no process-level CryptoProvider installed".
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# SQLite (re-exported by zcash_client_sqlite but needed for Connection type)
rusqlite = "0.37"
redb = "4.1.0"
# Bind explicit public detail loads to the existing physical wallet file.
same-file = "1.0.6"

# Logging. `log_redaction` installs the process logger, which masks
# identifiers and forwards to the backend FRB's default utils would install.
log = "0.4"
regex = "1"

# Hex encoding
hex = "0.4"

# Keystone hardware wallet
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
serde_json = "1"
url = "2.5.8"
# Vote-store proofs use SHA-256 through our existing sha2 dependency.
# ICS23 defaults add unrelated hashes and protobuf JSON support.
ics23 = { version = "0.12", default-features = false }
prost13 = { package = "prost", version = "0.13" }
tendermint = "0.40.4"
tendermint-light-client-verifier = "0.40.4"

# Zcash core. Package names are the Zakura forks; lib names stay upstream so
# `use orchard` / `use zcash_client_backend` keep working.
[dependencies.zcash_primitives]
package = "zakura-primitives"
version = "=5.0.0"
git = "https://github.com/zakura-core/common.git"
rev = "26fb46d9110092f07cc682f16d4678b01fb915df"
features = ["non-standard-fees"]

[dependencies.zcash_address]
package = "zakura-address"
version = "=5.0.0"
git = "https://github.com/zakura-core/common.git"
rev = "26fb46d9110092f07cc682f16d4678b01fb915df"

[dependencies.zcash_keys]
package = "zakura-keys"
version = "=5.0.0"
git = "https://github.com/zakura-core/common.git"
rev = "26fb46d9110092f07cc682f16d4678b01fb915df"
features = ["orchard"]

[dependencies.zcash_protocol]
package = "zakura-protocol"
version = "=5.0.0"
git = "https://github.com/zakura-core/common.git"
rev = "26fb46d9110092f07cc682f16d4678b01fb915df"

[dependencies.transparent]
package = "zakura-transparent"
version = "=5.0.0"
git = "https://github.com/zakura-core/common.git"
rev = "26fb46d9110092f07cc682f16d4678b01fb915df"

[dependencies.zcash_client_backend]
package = "zakura-client-backend"
version = "=0.1.0-rc9.6"
features = [
    "orchard",
    "transparent-inputs",
    "lightwalletd-tonic",
    "lightwalletd-tonic-tls-webpki-roots",
    "tor",
    "sync",
    "pczt",
]

[dependencies.zcash_client_sqlite]
package = "zakura-client-sqlite"
version = "=0.1.0-rc9.6"
features = ["orchard", "transparent-inputs", "unstable", "serde"]

[dependencies.zcash_voting]
version = "=5.3.0"
git = "https://github.com/valargroup/zcash_voting.git"
rev = "6d4ab976a7d6ea6c8a90186e5cca8d5eff387a90"

[dependencies.orchard]
package = "zakura-orchard"
version = "=5.0.0"
git = "https://github.com/zakura-core/common.git"
rev = "26fb46d9110092f07cc682f16d4678b01fb915df"
# Cargo unifies this feature with wallet-library Orchard and Ironwood tree hashing.
features = ["weighted-merkle"]

[dependencies.zcash_proofs]
package = "zakura-proofs"
version = "=5.0.0"
git = "https://github.com/zakura-core/common.git"
rev = "26fb46d9110092f07cc682f16d4678b01fb915df"
features = ["local-prover"]

[dependencies.pczt]
package = "zakura-pczt"
version = "=0.1.0-rc9"
features = [
    "orchard",
    "io-finalizer",
    "prover",
    "signer",
    "spend-finalizer",
    "tx-extractor",
    "zcp-builder",
]

[dependencies.ur-registry]
git = "https://github.com/valargroup/keystone-sdk-rust.git"
rev = "c2119436f5246be05b1ba877a7e6b63f51c01339"
package = "ur-registry"
default-features = false
features = ["std"]

# The platform log backends FRB 2.11.1 uses, at the versions it already pulls in.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = "0.2.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
ledger-transport = "0.11.0"
ledger-transport-hid = "0.11.0"

[dev-dependencies]
hyper = { version = "1", features = ["server", "http2"] }
# Deterministic signatures for validator-rotation verification tests.
ed25519-consensus = "2.1"
tempfile = "3"
hex = "0.4"

# Integration tests inject/inspect scan_queue rows directly to exercise the
# VZR-89 rescue path. Keep this version aligned with the [dependencies] entry.
rusqlite = "0.37"
# The scripted PIR probe transport builds the same typed failure the real
# transport attaches, and pauses time so the probe deadline is exercised
# without waiting on it. Both are already in the graph.
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
# The transparent PIR privacy tests match requests against the service routes
# with the library's own expression. Already in the graph.
regex = "1"

# Builds wallets through real private recovery for the history mapping tests.
[dev-dependencies.zcash_client_sqlite]
package = "zakura-client-sqlite"
version = "=0.1.0-rc9.6"
features = ["test-dependencies"]

[dev-dependencies.zcash_client_backend]
package = "zakura-client-backend"
version = "=0.1.0-rc9.6"
features = ["test-dependencies"]

[dev-dependencies.zcash_voting]
version = "=5.3.0"
git = "https://github.com/valargroup/zcash_voting.git"
rev = "6d4ab976a7d6ea6c8a90186e5cca8d5eff387a90"
features = ["test-fixtures"]

# Real adapter batches for the coordinator's fixture source, the fake txid
# display publication the loop-4 tests serve, and a real shard service in
# process. Keep the version aligned with the runtime dependency above.
[dev-dependencies.zakura-pir-client]
version = "=0.0.1-rc5"
default-features = false
features = ["testing"]

[dev-dependencies.ipir-sp]
version = "=0.1.0-rc.7"

[dev-dependencies.vote-commitment-tree]
version = "=0.8.0"
default-features = false
features = ["zakura"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)', 'cfg(ironwood_masquerade)'] }

[lints.clippy]
# These shapes are intentional at FFI/API boundaries or in transaction
# orchestration code. Refactoring them solely to satisfy style lints would add
# indirection without improving runtime safety.
too_many_arguments = "allow"
not_unsafe_ptr_arg_deref = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
# Test-only helpers intentionally sit next to the production code they verify,
# and several assertions document cfg-dependent invariants.
items_after_test_module = "allow"
assertions_on_constants = "allow"

# Wallet and voting dependencies use their coordinated published releases.
# Voting 5.2 is an explicit opt-in; keep the exact prerelease pin during validation.

# Flutter debug builds use Cargokit + Cargo's dev profile (`cargo build`
# without `--release`). Rust crypto and voting flows are slow under the default
# debug opt-level=0, so keep debug assertions and symbols while making local
# Flutter/debug voting builds usable. Release builds are unaffected by this
# profile.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# Shared PIR configuration and product routes are not released yet.
[patch.crates-io]
zakura-client-backend = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-client-sqlite = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-pczt = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-filters = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-pir-protocol = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-pir-query-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
zakura-pir-server-core = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
# The library above takes `ipir-sp` from git. Keep the app's test evaluator on that source.
ipir-sp = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }

# Voting uses the same wallet facade as the app.
zakura-wallet-lib = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "328327a8f38cfcbacbad7efae1b44c84049e9fa0" }
voting-circuits = { git = "https://github.com/valargroup/voting-circuits.git", rev = "262e12ce86727016c7b125b284becf1c2695a364" }
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits.git", rev = "262e12ce86727016c7b125b284becf1c2695a364" }
