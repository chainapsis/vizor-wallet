[package]
name = "rust_lib_zcash_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
zakura-pir-status = { version = "=0.0.1-rc1" }
zakura-transaction-status = { version = "=0.0.1-rc1" }
zcash_note_encryption = "0.4"
flutter_rust_bridge = "=2.11.1"

zcash_script = "0.4.3"
voting-crypto-deps = { version = "=0.2.4" }
sapling-crypto = { package = "zakura-sapling-crypto", version = "=2.0.0", default-features = false, features = ["circuit"] }
uuid = "1.1"
zip32 = "0.2"
pasta_curves = { package = "zakura-pasta-curves", version = "=2.0.0" }
ff = "0.14"
# Required by no-op Sapling prover trait impls
jubjub = { package = "zakura-jubjub", version = "=2.0.0" }
bls12_381 = { package = "zakura-bls12-381", version = "=2.0.0" }
rand_core = "0.6"
secp256k1 = "0.29"

# Key generation
bip0039 = "0.12"

# Serialization
nonempty = "0.11"
minicbor = "0.19"
prost = "0.14"
incrementalmerkletree = "0.8"
shardtree = "0.7"

# Security
secrecy = "0.8"
zeroize = "1"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
base64 = "0.22"
pbkdf2 = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

# Random number generation
rand = "0.8"

# Async runtime & gRPC
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
tonic = { version = "0.14", features = ["channel", "tls-webpki-roots", "tls-ring"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
tower-service = "0.3"
time = "0.3"
# rustls is in the graph transitively via tonic; make it a direct dep
# so we can explicitly install the ring CryptoProvider in `init_app`.
# Without an explicit provider install, rustls 0.23+ panics the first
# TLS handshake with "no process-level CryptoProvider installed".
rustls = "0.23"

# SQLite (re-exported by zcash_client_sqlite but needed for Connection type)
rusqlite = "0.37"
redb = "4.1.0"
# Bind explicit public detail loads to the existing physical wallet file.
same-file = "1.0.6"

# Logging (FRB forwards to Dart console via setup_default_user_utils)
log = "0.4"

# Hex encoding
hex = "0.4"

# Keystone hardware wallet
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
serde_json = "1"
url = "2.5.8"
ics23 = "0.12"
prost13 = { package = "prost", version = "0.13" }
tendermint = "0.40.4"
tendermint-light-client-verifier = "0.40.4"

# Zcash core. Package names are the Zakura forks; lib names stay upstream so
# `use orchard` / `use zcash_client_backend` keep working.
[dependencies.zcash_primitives]
package = "zakura-primitives"
version = "=2.0.0"

[dependencies.zcash_address]
package = "zakura-address"
version = "=2.0.0"

[dependencies.zcash_keys]
package = "zakura-keys"
version = "=2.0.0"
features = ["orchard"]

[dependencies.zcash_protocol]
package = "zakura-protocol"
version = "=2.0.0"

[dependencies.transparent]
package = "zakura-transparent"
version = "=2.0.0"

[dependencies.zcash_client_backend]
package = "zakura-client-backend"
version = "=0.1.0-rc8"
features = [
    "orchard",
    "transparent-inputs",
    "lightwalletd-tonic",
    "lightwalletd-tonic-tls-webpki-roots",
    "tor",
    "sync",
    "pczt",
]

[dependencies.zcash_client_sqlite]
package = "zakura-client-sqlite"
version = "=0.1.0-rc8"
features = ["orchard", "transparent-inputs", "unstable", "serde"]

[dependencies.zcash_voting]
version = "=5.1.1-rc.3"

[dependencies.orchard]
package = "zakura-orchard"
version = "=2.0.0"
# Cargo unifies this feature with wallet-library Orchard and Ironwood tree hashing.
features = ["weighted-merkle"]

[dependencies.zcash_proofs]
package = "zakura-proofs"
version = "=2.0.0"
features = ["local-prover"]

[dependencies.pczt]
package = "zakura-pczt"
version = "=0.1.0-rc5"
features = [
    "orchard",
    "io-finalizer",
    "prover",
    "signer",
    "spend-finalizer",
    "tx-extractor",
    "zcp-builder",
]

[dependencies.ur-registry]
git = "https://github.com/valargroup/keystone-sdk-rust.git"
rev = "c2119436f5246be05b1ba877a7e6b63f51c01339"
package = "ur-registry"
default-features = false
features = ["std"]

[dependencies.zakura-pir-enhance]
version = "=0.0.1-rc2"
default-features = false
features = ["wallet"]

# Transparent PIR recovery adapter. A git dependency rather than a patched
# crates.io package; see the `[patch.crates-io]` comment below.
[dependencies.zakura-pir-transparent]
git = "https://github.com/zakura-core/wallet-libraries"
rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc"
default-features = false
# `sqlite` applies a batch to the wallet and acknowledges it in one call.
features = ["sqlite"]

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
ledger-transport = "0.11.0"
ledger-transport-hid = "0.11.0"

[dev-dependencies]
hyper = { version = "1", features = ["server", "http2"] }
# Deterministic signatures for validator-rotation verification tests.
ed25519-consensus = "2.1"
tempfile = "3"
hex = "0.4"

# Integration tests inject/inspect scan_queue rows directly to exercise the
# VZR-89 rescue path. Keep this version aligned with the [dependencies] entry.
rusqlite = "0.37"
# The scripted PIR probe transport builds the same typed failure the real
# transport attaches, and pauses time so the probe deadline is exercised
# without waiting on it. Both are already in the graph.
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
# The transparent PIR privacy tests match requests against the service routes
# with the library's own expression. Already in the graph.
regex = "1"

# Builds wallets through real private recovery for the history mapping tests.
[dev-dependencies.zcash_client_sqlite]
package = "zakura-client-sqlite"
version = "=0.1.0-rc8"
features = ["test-dependencies"]

[dev-dependencies.zcash_client_backend]
package = "zakura-client-backend"
version = "=0.1.0-rc8"
features = ["test-dependencies"]

[dev-dependencies.zcash_voting]
version = "=5.1.1-rc.3"
features = ["test-fixtures"]

# Real adapter batches for the coordinator's fixture source, the fake txid
# display publication the loop-4 tests serve, and a real shard service in
# process, with the wallet-pir crates it publishes with. Same rev as the
# dependency above.
[dev-dependencies.zakura-pir-transparent]
git = "https://github.com/zakura-core/wallet-libraries"
rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc"
default-features = false
features = ["sqlite", "testing"]

[dev-dependencies.ipir-sp]
version = "=0.1.0-rc.7"

[dev-dependencies.vote-commitment-tree]
version = "=0.6.3"
default-features = false
features = ["zakura"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)', 'cfg(ironwood_masquerade)'] }

[lints.clippy]
# These shapes are intentional at FFI/API boundaries or in transaction
# orchestration code. Refactoring them solely to satisfy style lints would add
# indirection without improving runtime safety.
too_many_arguments = "allow"
not_unsafe_ptr_arg_deref = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
# Test-only helpers intentionally sit next to the production code they verify,
# and several assertions document cfg-dependent invariants.
items_after_test_module = "allow"
assertions_on_constants = "allow"

# The transparent PIR ledger is in wallet-libraries but not released. Patch the
# crates.io packages rather than depending on git directly: other dependencies
# (including zakura-pir-enhance) reach these crates through
# crates.io, and a direct git dependency would duplicate them. `zakura-pczt`
# and `zakura-pir-enhance-types` are patched because the git
# `zakura-client-backend` depends on them by path. Drop this once a release
# includes the revision.
#
# `zakura-pir-transparent` is the exception, a direct git dependency: it is
# not released on crates.io yet. Keep its rev equal to these so its path
# dependencies on the backend and SQLite crates resolve to the patched sources.
#
# Pinned to wallet-libraries main at PR #190 (docs only), after the PIR
# reaction-leak increment 1: PR #189 and #187 (a schema-6 transparent PIR
# companion upgrades in place to schema 7), PR #188 (a given-up receipt
# lookup is its own `TransparentDisplayView::GaveUp`), PR #182 (a bad reply
# fails one directory entry; three hold the account as
# `HoldCause::FailedEntries`; wallet-pir `0.1.0-rc.4` by git rev), PR #181 (one
# recovery pass per sync; `Step::Wait` removed), PR #180 (Enhance PIR
# content failures counted per position in an in-memory `EnhancePirSession`)
# and PR #179 (one receipt content schedule; give up after three content
# failures), after PR #177 (release packaging checks only), PR #175 (the testing fake txid display publication on txid-4k8),
# PR #174 (the wallet-pir transparent crates from crates.io at 0.1.0-rc.3,
# which read the 4,096-row txid display tables),
# PR #169 (the ipir-sp family at 0.1.0-rc.7), PR #167 (the 8-bit txid
# display), PR #165 (the 8-bit history profile and the /v2 API) and PR #153
# (discovery that continues past its
# budget, and the in-process shard service under `testing`), after PR #152
# (rewound receives stay pending, deferrals carry the policy generation), PR #151
# (unused transparent-recovery API removed), PR #147 (account activity, unattributed fees and the receipt
# read), PR #150 (forget refuses a policy changed
# since it began), PR #149 (interrupted settlements skip, policy changes stop,
# timed-out lookups back off), PR #148 (a rewound private receive stays pending),
# PR #146 (the recovery pass driver), PR #144 (typed transparent authority refusals and the ordered private-recovery
# forget), PR #145 (the txid detail run driver and preferred receipts), the
# transparent-ledger renames (activation, recovery suspension, address watch
# sets), PR #137 (Enhance queries over only the rows a domain can hold), PR #140
# (the same for a growing Transparent tail's pages), PR #139 (import-time account
# discovery), PR #138 (the gated settlement this wallet uses to lock one commit
# at a time), PR #134 (forget transparent ledger facts under `Public`), PR #133
# (dithered 44-bit native queries for Transparent, Enhance and Status) and
# PR #135 (the raw HTTP exchange, companion directory, settlement actions, txid
# display service and `testing` feature this wallet builds on).
# `zakura-pir-enhance` is patched too so its client uploads the dithered query.
# The status response hook also needs its status/native path dependencies here
# so their public types stay unified. Keep every wallet-libraries dependency at
# this exact revision.
[patch.crates-io]
zakura-client-backend = { git = "https://github.com/zakura-core/wallet-libraries", rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc" }
zakura-client-sqlite = { git = "https://github.com/zakura-core/wallet-libraries", rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc" }
zakura-pczt = { git = "https://github.com/zakura-core/wallet-libraries", rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc" }
zakura-pir-enhance-types = { git = "https://github.com/zakura-core/wallet-libraries", rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc" }
zakura-transaction-status = { git = "https://github.com/zakura-core/wallet-libraries", rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc" }
zakura-pir-status = { git = "https://github.com/zakura-core/wallet-libraries", rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc" }
zakura-pir-native = { git = "https://github.com/zakura-core/wallet-libraries", rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc" }
zakura-pir-enhance = { git = "https://github.com/zakura-core/wallet-libraries", rev = "a905e7af97735bfa19bc6aa0e720a7c6855698dc" }

# Flutter debug builds use Cargokit + Cargo's dev profile (`cargo build`
# without `--release`). Rust crypto and voting flows are slow under the default
# debug opt-level=0, so keep debug assertions and symbols while making local
# Flutter/debug voting builds usable. Release builds are unaffected by this
# profile.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
