[package]
name = "rust_lib_zcash_wallet"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/facade.rs"
crate-type = ["cdylib", "staticlib", "rlib"]

# Keep the native package as the artifact boundary. Runtime dependencies
# belong to the implementation crate. FRB remains here for codegen.
[dependencies]
vizor_wallet_impl = { package = "vizor-wallet-implementation", path = "src/implementation" }
flutter_rust_bridge = { workspace = true }

# Existing examples/integration tests retain their direct imports and
# original test-only feature edges. Unit tests live in core.
[dev-dependencies]
anyhow = { workspace = true }
bip0039 = { workspace = true }
ed25519-consensus = { workspace = true }
hex = { workspace = true }
hyper = { workspace = true, features = ["server", "http2"] }
ipir-sp = { workspace = true }
orchard = { workspace = true }
pczt = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true }
secp256k1 = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shardtree = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["test-util", "time"] }
transparent = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vote-commitment-tree = { workspace = true }
voting-crypto-deps = { workspace = true }
zakura-pir-client = { workspace = true, features = ["testing"] }
zcash_address = { workspace = true }
zcash_client_backend = { workspace = true, features = ["test-dependencies"] }
zcash_client_sqlite = { workspace = true, features = ["test-dependencies"] }
zcash_keys = { workspace = true }
zcash_note_encryption = { workspace = true }
zcash_primitives = { workspace = true }
zcash_protocol = { workspace = true }
zcash_voting = { workspace = true, features = ["test-fixtures"] }
zip32 = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)', 'cfg(ironwood_masquerade)'] }

[lints.clippy]
# These shapes are intentional at FFI/API boundaries or in transaction
# orchestration code. Refactoring them solely to satisfy style lints would add
# indirection without improving runtime safety.
too_many_arguments = "allow"
not_unsafe_ptr_arg_deref = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
# Test-only helpers intentionally sit next to the production code they verify,
# and several assertions document cfg-dependent invariants.
items_after_test_module = "allow"
assertions_on_constants = "allow"

# Wallet and voting dependencies use their coordinated published releases.
# Voting 5.2 is an explicit opt-in; keep the exact prerelease pin during validation.

# Flutter debug builds use Cargokit + Cargo's dev profile (`cargo build`
# without `--release`). Rust crypto and voting flows are slow under the default
# debug opt-level=0, so keep debug assertions and symbols while making local
# Flutter/debug voting builds usable. Release builds are unaffected by this
# profile.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# Shared PIR configuration and product routes are not released yet.
[patch.crates-io]
zakura-client-backend = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bed478f1ec48814197f2c5aa386c14d046c7e52f" }
zakura-client-sqlite = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bed478f1ec48814197f2c5aa386c14d046c7e52f" }
zakura-pczt = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bed478f1ec48814197f2c5aa386c14d046c7e52f" }
zakura-filters = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bed478f1ec48814197f2c5aa386c14d046c7e52f" }
zakura-pir-client = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bed478f1ec48814197f2c5aa386c14d046c7e52f" }
zakura-pir-protocol = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bed478f1ec48814197f2c5aa386c14d046c7e52f" }
zakura-pir-publisher = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bed478f1ec48814197f2c5aa386c14d046c7e52f" }
zakura-pir-query-server = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bed478f1ec48814197f2c5aa386c14d046c7e52f" }
zakura-pir-server-core = { git = "https://github.com/zakura-core/wallet-libraries.git", rev = "bed478f1ec48814197f2c5aa386c14d046c7e52f" }
# The library above takes `ipir-sp` from git. Keep the app's test evaluator on that source.
ipir-sp = { git = "https://github.com/valargroup/ipir-sp", rev = "5ea080a3281a01c5459f585e0a1bbbde50ec2bd2" }

[workspace]
members = ["src/implementation"]
default-members = [".", "src/implementation"]
resolver = "2"

# Shared core/test/example versions and production feature baselines.
# Add dev-only features at the member edge, not to this shared table.
[workspace.dependencies]
anyhow = "1"
bip0039 = "0.12"
ed25519-consensus = "2.1"
flutter_rust_bridge = "=2.11.1"
hex = "0.4"
hyper = "1"
ipir-sp = { version = "=0.1.0-rc.7" }
orchard = { package = "zakura-orchard", version = "=4.0.0", features = ["weighted-merkle"] }
pczt = { package = "zakura-pczt", version = "=0.1.0-rc9", features = ["orchard", "io-finalizer", "prover", "signer", "spend-finalizer", "tx-extractor", "zcp-builder"] }
rand = "0.8"
regex = "1"
rusqlite = "0.37"
secp256k1 = "0.33"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shardtree = "0.7"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
transparent = { package = "zakura-transparent", version = "=4.0.0" }
url = "2.5.8"
uuid = "1.1"
vote-commitment-tree = { version = "=0.8.0", default-features = false, features = ["zakura"] }
voting-crypto-deps = "=0.4.0"
zakura-pir-client = { version = "=0.0.1-rc3", default-features = false, features = ["enhance", "status", "transparent", "wallet", "sqlite", "lightwalletd"] }
zcash_address = { package = "zakura-address", version = "=4.0.0" }
zcash_client_backend = { package = "zakura-client-backend", version = "=0.1.0-rc9.4", features = ["orchard", "transparent-inputs", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots", "tor", "sync", "pczt"] }
zcash_client_sqlite = { package = "zakura-client-sqlite", version = "=0.1.0-rc9.4", features = ["orchard", "transparent-inputs", "unstable", "serde"] }
zcash_keys = { package = "zakura-keys", version = "=4.0.0", features = ["orchard"] }
zcash_note_encryption = { package = "zakura-note-encryption", version = "=4.0.0" }
zcash_primitives = { package = "zakura-primitives", version = "=4.0.0", features = ["non-standard-fees"] }
zcash_protocol = { package = "zakura-protocol", version = "=4.0.0" }
zcash_voting = { version = "=5.2.0-rc.2" }
zip32 = "0.2"
