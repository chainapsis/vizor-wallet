[package]
name = "rust_lib_zcash_wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Development only. Forwards zcash_voting's unstable, test-only switch
# (`proxy::PROXY_DELEGATION_ENABLED`), so a debug build run with
# `--dart-define=VIZOR_PROXY_DELEGATION_ENABLED=true` can delegate on a
# gate-open dev chain. Never in a default, profile or release build:
# `src/lib.rs` refuses to compile it without debug assertions, cargokit adds
# it only to a debug build started with VIZOR_UNSTABLE_PROXY_DELEGATION=1,
# and `unstable_proxy_delegation_guard` tests both.
unstable-proxy-delegation = ["zcash_voting/unstable-proxy-delegation"]

[dependencies]
zakura-pir-protocol = { version = "=0.0.1-rc7", default-features = false, features = ["http-endpoint"] }
zakura-pir-config = "=0.1.3"
zakura-service-config = "=0.1.0"
zakura-pir-client = { version = "=0.0.1-rc7", default-features = false, features = ["enhance", "status", "transparent", "wallet", "sqlite", "lightwalletd", "receiver-wallet"] }
zakura-one-time-ivk = "=0.0.1-rc5"
zakura-near-intents = "=0.0.1-rc6"
zcash_note_encryption = { package = "zakura-note-encryption", version = "=5.4.0" }
# The app installs its own redacting logger and panic hook.
# Supported targets provide the atomic widths used by FRB.
flutter_rust_bridge = { version = "=2.11.1", default-features = false, features = [
    "anyhow",
    "dart-opaque",
    "log",
    "rust-async",
    "thread-pool",
    "wasm-start",
] }

# Common 5 uses the Zakura script fork; keep the upstream lib name.
zcash_script = { package = "zakura-zcash-script", version = "=0.0.1" }
voting-crypto-deps = "=0.5.0"
sapling-crypto = { package = "zakura-sapling-crypto", version = "=5.4.0", default-features = false, features = ["circuit"] }
uuid = "1.1"
zip32 = "0.2"
pasta_curves = { package = "zakura-pasta-curves", version = "=5.4.0" }
ff = "0.14"
# Required by no-op Sapling prover trait impls
jubjub = { package = "zakura-jubjub", version = "=5.4.0" }
bls12_381 = { package = "zakura-bls12-381", version = "=5.4.0" }
rand_core = "0.6"
secp256k1 = "0.33"

# Key generation
bip0039 = { version = "0.12", default-features = false, features = ["rand"] }

# Serialization
nonempty = "0.11"
minicbor = "0.19"
prost = "0.14"
incrementalmerkletree = "0.8"
shardtree = "0.7"

# Security
secrecy = "0.8"
zeroize = "1"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
base64 = "0.22"
pbkdf2 = "0.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

# Random number generation
rand = "0.8"
# Preserve the existing entropy and browser backends after trimming Flume.
getrandom = { version = "0.2", default-features = false, features = ["js", "rdrand"] }

# Async runtime & gRPC
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
# Scan thread pools at reduced power (`sync_engine::scan_power`); both are
# already in the graph through the wallet libraries.
rayon = "1.12"
libc = "0.2"
tonic = { version = "0.14", features = ["channel", "tls-webpki-roots", "tls-ring"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
tower-service = "0.3"
time = "0.3"
# rustls is in the graph transitively via tonic; make it a direct dep
# so we can explicitly install the ring CryptoProvider in `init_app`.
# Without an explicit provider install, rustls 0.23+ panics the first
# TLS handshake with "no process-level CryptoProvider installed".
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# SQLite (re-exported by zcash_client_sqlite but needed for Connection type)
rusqlite = "0.37"
redb = "4.1.0"
# Bind explicit public detail loads to the existing physical wallet file.
same-file = "1.0.6"

# Logging. `log_redaction` installs the process logger, which masks
# identifiers and forwards to the backend FRB's default utils would install.
log = { version = "0.4", features = ["std"] }
regex = "1"

# Hex encoding
hex = "0.4"

# Keystone hardware wallet
ur = { git = "https://github.com/KeystoneHQ/ur-rs", tag = "0.3.3" }
serde_json = "1"
url = "2.5.8"
# Vote-store proofs use SHA-256 through our existing sha2 dependency.
# ICS23 defaults add unrelated hashes and protobuf JSON support.
ics23 = { version = "0.12", default-features = false }
prost13 = { package = "prost", version = "0.13" }
tendermint = "0.40.4"
tendermint-light-client-verifier = "0.40.4"
# Delegate pictures are decoded in pure Rust, never by a platform decoder.
image-webp = "0.2.4"

# Zcash core. Package names are the Zakura forks; lib names stay upstream so
# `use orchard` / `use zcash_client_backend` keep working.
[dependencies.zcash_primitives]
package = "zakura-primitives"
version = "=5.4.0"
features = ["non-standard-fees"]

[dependencies.zcash_address]
package = "zakura-address"
version = "=5.4.0"

[dependencies.zcash_keys]
package = "zakura-keys"
version = "=5.4.0"
features = ["orchard"]

[dependencies.zcash_protocol]
package = "zakura-protocol"
version = "=5.4.0"

[dependencies.transparent]
package = "zakura-transparent"
version = "=5.4.0"

[dependencies.zcash_client_backend]
package = "zakura-client-backend"
version = "=0.1.0-rc9.8"
features = [
    "orchard",
    "transparent-inputs",
    "lightwalletd-tonic",
    "lightwalletd-tonic-tls-webpki-roots",
    "tor-client",
    "sync",
    "pczt",
]

[dependencies.zcash_client_sqlite]
package = "zakura-client-sqlite"
version = "=0.1.0-rc9.8"
features = ["orchard", "transparent-inputs", "unstable", "serde"]

# 5.4.0, not main's 5.4.1, only because the zcash_voting rev in
# `[patch.crates-io]` below still says 5.4.0 in its manifest, and a patch
# replaces only a version its requirement matches. That rev sits on
# zcash_voting main, which already has both 5.4.1 changes (the Ledger
# delegation recovery and the bounded PIR uploads). Go back to the released
# version when a tag replaces the rev.
[dependencies.zcash_voting]
version = "=5.4.0"

# Proxy delegation formats shared with the chain (contracts-v1 section 14).
# Not on crates.io yet, so only the `[patch.crates-io]` entry below supplies
# it, from the same zcash_voting rev, and Vizor and zcash_voting build one
# copy of the crate.
[dependencies.zcash_vote_delegate]
version = "=0.1.0"

[dependencies.orchard]
package = "zakura-orchard"
version = "=5.4.0"
# Cargo unifies this feature with wallet-library Orchard and Ironwood tree hashing.
features = ["weighted-merkle"]

[dependencies.zcash_proofs]
package = "zakura-proofs"
version = "=5.4.0"
features = ["local-prover"]

[dependencies.pczt]
package = "zakura-pczt"
version = "=0.1.0-rc9.1"
features = [
    "orchard",
    "io-finalizer",
    "prover",
    "signer",
    "spend-finalizer",
    "tx-extractor",
    "zcp-builder",
]

[dependencies.ur-registry]
git = "https://github.com/valargroup/keystone-sdk-rust.git"
rev = "c2119436f5246be05b1ba877a7e6b63f51c01339"
package = "ur-registry"
default-features = false
features = ["std"]

# The platform log backends FRB 2.11.1 uses, at the versions it already pulls in.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = { version = "0.2.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.7", features = ["OSX_10_15"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
hidapi = { version = "2.6.1", default-features = false, features = ["linux-static-hidraw"] }

[dev-dependencies]
hyper = { version = "1", features = ["server", "http2"] }
# Deterministic signatures for validator-rotation verification tests.
ed25519-consensus = "2.1"
tempfile = "3"
hex = "0.4"

# Integration tests inject/inspect scan_queue rows directly to exercise the
# VZR-89 rescue path. Keep this version aligned with the [dependencies] entry.
rusqlite = "0.37"
# The scripted PIR probe transport builds the same typed failure the real
# transport attaches, and pauses time so the probe deadline is exercised
# without waiting on it. Both are already in the graph.
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time"] }
# The transparent PIR privacy tests match requests against the service routes
# with the library's own expression. Already in the graph.
regex = "1"

# Builds wallets through real private recovery for the history mapping tests.
[dev-dependencies.zcash_client_sqlite]
package = "zakura-client-sqlite"
version = "=0.1.0-rc9.8"
features = ["test-dependencies"]

[dev-dependencies.zcash_client_backend]
package = "zakura-client-backend"
version = "=0.1.0-rc9.8"
features = ["test-dependencies"]

# The same version as the runtime dependency above, for the same reason.
[dev-dependencies.zcash_voting]
version = "=5.4.0"
features = ["test-fixtures"]

# Real adapter batches for the coordinator's fixture source, the fake txid
# display publication the loop-4 tests serve, and a real shard service in
# process. Keep the version aligned with the runtime dependency above.
[dev-dependencies.zakura-pir-client]
version = "=0.0.1-rc7"
default-features = false
features = ["testing"]

[dev-dependencies.zakura-pir-query-server]
version = "=0.0.1-rc7"
features = ["receiver"]

[dev-dependencies.zakura-pir-publisher]
version = "=0.0.1-rc7"
features = ["receiver-crypto"]

[dev-dependencies.ipir-sp]
version = "=0.1.0-rc.8"

[dev-dependencies.vote-commitment-tree]
version = "=0.9.0"
default-features = false
features = ["zakura"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
# These shapes are intentional at FFI/API boundaries or in transaction
# orchestration code. Refactoring them solely to satisfy style lints would add
# indirection without improving runtime safety.
too_many_arguments = "allow"
not_unsafe_ptr_arg_deref = "allow"
type_complexity = "allow"
should_implement_trait = "allow"
# Test-only helpers intentionally sit next to the production code they verify,
# and several assertions document cfg-dependent invariants.
items_after_test_module = "allow"
assertions_on_constants = "allow"

# Wallet and voting dependencies use their coordinated published releases.
# Voting 5.4 is an explicit opt-in; keep the exact pins during validation.

# Flutter debug builds use Cargokit + Cargo's dev profile (`cargo build`
# without `--release`). Rust crypto and voting flows are slow under the default
# debug opt-level=0, so keep debug assertions and symbols while making local
# Flutter/debug voting builds usable. Release builds are unaffected by this
# profile.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# Proxy delegation, until zcash_voting and voting-circuits tag releases with
# it: each crate family comes from one commit of its repository, so a single
# copy of every crate builds. The zcash_voting rev is the top of its proxy
# delegation stack, the first with the delegate ballot list reader that the
# delegator's status also uses. The voting-circuits rev adds ZKP4 to 0.15.0.
# The direct voting-crypto-deps and test vote-commitment-tree pins follow
# these revs too.
[patch.crates-io]
zcash_voting = { git = "https://github.com/valargroup/zcash_voting", rev = "36845eb4791a8e6bc61ce35f0f3e6bf2c03ed054" }
zcash_vote_delegate = { git = "https://github.com/valargroup/zcash_voting", rev = "36845eb4791a8e6bc61ce35f0f3e6bf2c03ed054" }
vote-commitment-tree = { git = "https://github.com/valargroup/zcash_voting", rev = "36845eb4791a8e6bc61ce35f0f3e6bf2c03ed054" }
voting-circuits = { git = "https://github.com/valargroup/voting-circuits", rev = "aa3ba600ddcd58db23d1c4e9de8c3ed2e28cdb56" }
voting-crypto-deps = { git = "https://github.com/valargroup/voting-circuits", rev = "aa3ba600ddcd58db23d1c4e9de8c3ed2e28cdb56" }
