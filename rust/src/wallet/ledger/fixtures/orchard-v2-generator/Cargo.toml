[package]
name = "historical-pczt-generator"
version = "0.0.0"
edition = "2021"

[dependencies]
orchard = { package = "zakura-orchard", version = "=2.2.0", features = ["circuit"] }
pczt = { package = "zakura-pczt", git = "https://github.com/zakura-core/wallet-libraries.git", rev = "3fc2bf443020194c56a71d1f63c0d24002cc9517", features = ["orchard", "io-finalizer", "zcp-builder"] }
zcash_primitives = { package = "zakura-primitives", version = "=2.2.0" }
zcash_protocol = { package = "zakura-protocol", version = "=2.2.0" }
halo2 = { package = "zakura-halo2-proofs", version = "=2.2.0", features = ["multicore"] }
rand = "0.10"
hex = "0.4"
serde_json = "1"

[patch.crates-io]
