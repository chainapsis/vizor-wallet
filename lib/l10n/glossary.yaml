# Vizor terminology, one entry per concept.
#
# Translators use the `term` for their locale whenever the English source
# contains `en`. `status: candidate` marks a proposal that a native reviewer has
# not confirmed yet; confirm it by changing the status to `confirmed`.
#
# test/l10n/l10n_gates_test.dart enforces:
#   - `dnt: true` terms stay verbatim in every translation of a message that
#     contains them;
#   - `forbidden` variants never appear in a translation of a message that
#     contains the English term;
#   - `confirmed` terms appear in every translation of a message that contains
#     the English term.
# Candidates are guidance only.
#
# Sources for candidates: Keplr's ko and zh-cn strings (consistency within the
# company; several of them disagree with each other, so none is copied
# blindly), common usage in Korean and Chinese wallets and exchanges, and the
# Zcash community. See docs/i18n/ for the style guides.

terms:
  # Names and symbols that are never translated.
  - {id: vizor, en: Vizor, dnt: true}
  - {id: zcash, en: Zcash, dnt: true}
  - {id: zec, en: ZEC, dnt: true}
  - {id: usdc, en: USDC, dnt: true}
  - {id: usdt, en: USDT, dnt: true}
  - {id: near, en: NEAR, dnt: true}
  - {id: orchard, en: Orchard, dnt: true}
  - {id: sapling, en: Sapling, dnt: true}
  - {id: ironwood, en: Ironwood, dnt: true}
  - {id: keystone, en: Keystone, dnt: true}
  - {id: ledger, en: Ledger, dnt: true}
  - {id: tor, en: Tor, dnt: true}
  - {id: zip321, en: ZIP-321, dnt: true}

  # Wallet basics.
  - id: wallet
    en: wallet
    ko: {term: 지갑, status: candidate}
    zh: {term: 钱包, status: candidate}
  - id: account
    en: account
    ko: {term: 계정, status: candidate}
    zh: {term: 账户, status: candidate}
  - id: balance
    en: balance
    ko: {term: 잔액, status: candidate}
    zh: {term: 余额, status: candidate}
  - id: send
    en: send
    definition: Transferring funds to another address (verb or button).
    ko: {term: 보내기, status: candidate, note: "Keplr uses 전송 and 토큰 전송; pick one."}
    zh: {term: 发送, status: candidate, note: "Keplr uses both 发送 and 转账; a transaction type may read better as 转账."}
  - id: receive
    en: receive
    ko: {term: 받기, status: candidate}
    zh: {term: 接收, status: candidate, note: "收款 for payment requests."}
  - id: swap
    en: swap
    ko: {term: 스왑, status: candidate, note: "Keplr uses 교환 and 토큰 교환."}
    zh: {term: 兑换, status: candidate, note: "Keplr uses both 交换 and 兑换."}
  - id: fee
    en: fee
    ko: {term: 수수료, status: candidate}
    zh: {term: 手续费, status: candidate, note: "Keplr uses 费用; network fee may read 网络手续费."}
  - id: transaction
    en: transaction
    ko: {term: 거래, status: candidate}
    zh: {term: 交易, status: candidate}
  - id: address
    en: address
    ko: {term: 주소, status: candidate}
    zh: {term: 地址, status: candidate}
  - id: memo
    en: memo
    ko: {term: 메모, status: candidate}
    zh: {term: 备注, status: candidate}
  - id: amount
    en: amount
    ko: {term: 금액, status: candidate}
    zh: {term: 金额, status: candidate}
  - id: pending
    en: pending
    ko: {term: 대기 중, status: candidate}
    zh: {term: 处理中, status: candidate}
  - id: confirmations
    en: confirmations
    ko: {term: 확인 수, status: candidate}
    zh: {term: 确认数, status: candidate}
  - id: sync
    en: sync
    ko: {term: 동기화, status: candidate}
    zh: {term: 同步, status: candidate}
  - id: endpoint
    en: endpoint
    ko: {term: 엔드포인트, status: candidate, note: "Keplr uses 노드 주소."}
    zh: {term: 节点, status: candidate, note: "Keplr uses 端点."}
  - id: explorer
    en: explorer
    ko: {term: 블록 탐색기, status: candidate}
    zh: {term: 区块浏览器, status: candidate}
  - id: address_book
    en: address book
    ko: {term: 주소록, status: candidate}
    zh: {term: 地址簿, status: candidate}
  - id: network
    en: network
    ko: {term: 네트워크, status: candidate}
    zh: {term: 网络, status: candidate}
  - id: block_height
    en: block height
    ko: {term: 블록 높이, status: candidate}
    zh: {term: 区块高度, status: candidate}

  # Zcash concepts. None of these exist in Keplr's strings.
  - id: shielded
    en: shielded
    definition: Funds or addresses in an encrypted Zcash pool (Orchard, Sapling, Ironwood).
    ko: {term: 비공개, status: candidate, forbidden: [차폐], note: "UI labels: 비공개 주소, 비공개 잔액. A completed shielding transaction is 비공개 전환; a hidden sender is 보낸 사람 비공개. Privacy-focused display headings may use natural prose rather than the literal label."}
    zh: {term: 隐私, status: candidate, forbidden: [屏蔽], note: "UI labels: 隐私地址, 隐私余额. A completed shielding transaction is 隐私转换; a hidden sender is 发送方未公开. Avoid wording that implies blocking, muting, or guaranteed anonymity."}
  - id: transparent
    en: transparent
    definition: Funds or addresses whose amounts and parties are public on chain.
    ko: {term: 공개, status: confirmed, forbidden: [투명], note: "공개 주소, 공개 잔액. Describes on-chain visibility, independently of whether Private queries is enabled."}
    zh: {term: 公开, status: confirmed, forbidden: [透明], note: "公开地址, 公开余额. Describes on-chain visibility, independently of whether 隐私查询 is enabled."}
  - id: shield_verb
    en: shield
    definition: Move transparent funds into a shielded pool.
    ko: {term: 비공개 전환, status: candidate, forbidden: [차폐], note: "Action: 비공개로 전환. Progress: 비공개 전환 중. Success: 잔액을 비공개로 전환했어요. Funds move on-chain; this is not the hide-balance display toggle."}
    zh: {term: 隐私转换, status: candidate, forbidden: [屏蔽], note: "Action: 转为隐私余额. Progress: 隐私转换中. Success: 已转为隐私余额. Funds move on-chain; this is not the hide-balance display toggle."}
  - id: unified_address
    en: unified address
    ko: {term: 통합 주소, status: candidate}
    zh: {term: 统一地址, status: candidate}
  - id: viewing_key
    en: viewing key
    ko: {term: 뷰잉 키, status: candidate, note: "Keplr writes 뷰잉키."}
    zh: {term: 查看密钥, status: candidate, forbidden: [查看秘钥]}
  - id: pool
    en: pool
    ko: {term: 풀, status: candidate}
    zh: {term: 资金池, status: candidate}
  - id: wallet_birthday
    en: wallet birthday
    definition: The block height a wallet starts scanning from.
    ko: {term: 지갑 생성 높이, status: candidate}
    zh: {term: 钱包创建高度, status: candidate}
  - id: private_queries
    en: private queries
    ko: {term: 비공개 조회, status: candidate}
    zh: {term: 隐私查询, status: candidate}
  - id: migration
    en: migration
    definition: Moving funds from the Orchard pool to Ironwood.
    ko: {term: 마이그레이션, status: confirmed, forbidden: [이전], note: "이전 keeps its everyday meaning, previous."}
    zh: {term: 迁移, status: candidate}

  # Security. Every message with one of these terms is a [security] string.
  - id: secret_passphrase
    en: secret passphrase
    definition: Vizor's name for the BIP-39 mnemonic word list. Not the optional BIP-39 passphrase (25th word).
    tags: [security]
    ko: {term: 복구 문구, status: candidate, note: "Keplr uses 복구 문구. Avoid a literal 비밀 암호문."}
    zh: {term: 助记词, status: candidate, forbidden: [密码短语]}
  - id: bip39_passphrase
    en: BIP39 passphrase
    definition: The optional 25th word that derives a separate wallet from the same secret passphrase.
    tags: [security]
    ko: {term: 패스프레이즈, status: candidate, note: "Keep distinct from 복구 문구 (secret passphrase) and 암호 (passcode)."}
    zh: {term: 密码短语, status: candidate, note: "Keep distinct from 助记词 (secret passphrase)."}
  - id: password
    en: password
    tags: [security]
    ko: {term: 비밀번호, status: candidate}
    zh: {term: 密码, status: candidate}
  - id: passcode
    en: passcode
    definition: The 6-digit mobile unlock code.
    tags: [security]
    ko: {term: 암호, status: candidate, note: "iOS Korean calls the device passcode 암호; 패스코드 also seen."}
    zh: {term: 数字密码, status: candidate, note: "Keep distinct from 密码 (password)."}
  - id: hardware_wallet
    en: hardware wallet
    ko: {term: 하드웨어 지갑, status: candidate}
    zh: {term: 硬件钱包, status: candidate}
  - id: sign
    en: sign
    tags: [security]
    ko: {term: 서명, status: candidate}
    zh: {term: 签名, status: candidate}

  # Features.
  - id: gift_card
    en: gift card
    ko: {term: 기프트 카드, status: candidate}
    zh: {term: 礼品卡, status: candidate}
  - id: redeem
    en: redeem
    ko: {term: 받기, status: candidate, note: "Gift Card redeem and claim are the same action."}
    zh: {term: 领取, status: candidate, note: "兑换 is swap; keep them apart in the activity feed."}
  - id: deposit
    en: deposit
    ko: {term: 입금, status: candidate}
    zh: {term: 存入, status: candidate, note: "Swap deposits. Gift Card funding keeps 充值."}
  - id: payment_request
    en: payment request
    ko: {term: 결제 요청, status: candidate}
    zh: {term: 收款请求, status: candidate}
  - id: voting
    en: voting
    ko: {term: 투표, status: candidate}
    zh: {term: 投票, status: candidate}
  - id: activity
    en: activity
    ko: {term: 활동, status: candidate}
    zh: {term: 活动记录, status: candidate, note: "活动 alone reads as a promotion or event."}
  - id: migration_batch
    en: batch
    ko: {term: 묶음, status: candidate, note: "일괄 stays for batch signing."}
    zh: {term: 批次, status: candidate}
  - id: request_link
    en: request link
    ko: {term: 요청 링크, status: candidate}
    zh: {term: 收款链接, status: candidate}
  - id: self_custody
    en: self-custody
    ko: {term: 직접 보관, status: candidate}
    zh: {term: 自主托管, status: candidate}
