[package]
name = "voting-validator-verifier"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
hex = "0.4"
ics23 = { version = "0.12", default-features = false }
prost13 = { package = "prost", version = "0.13" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tendermint = "=0.40.4"
tendermint-light-client-verifier = "=0.40.4"
