[package]
name = "zcash_voting"
version = "0.11.0"
edition = "2021"
description = "Client-side library for Zcash shielded voting: ZKP delegation and vote-commitment proofs (Halo 2), ElGamal encryption, governance PCZT construction, Merkle witness generation, and SQLite round-state persistence."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[dependencies]
# Curves (same as Orchard/Zcash)
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"

# Randomness
rand = "0.8"

# Hashing
blake2b_simd = "1"
halo2_gadgets = "=0.5.0"
halo2_proofs = "0.3"
sinsemilla = "0.1"

# Serialization
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
sha2 = "0.10"
ed25519-dalek = "2"

# PIR (private nullifier exclusion proofs).
pir-client = { version = "=0.3.0", default-features = false }
# Supply-chain pins for the Valar-owned PIR/tree dependency surface. These
# direct dependencies constrain the versions Cargo may resolve, but they do not
# change whether upstream build scripts execute.
pir-types = { version = "=0.2.0", default-features = false }
valar-spiral-rs = { version = "=0.5.2", default-features = false }
valar-ypir = { version = "=0.1.5", default-features = false }
imt-tree = { version = "=0.2.0" }

bytes = { version = "1" }
http = { version = "1" }
http-body-util = { version = "0.1" }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tonic = { version = "0.14", features = ["channel", "tls-webpki-roots", "tls-ring"] }

vote-commitment-tree = { path = "../vote-commitment-tree", version = "=0.3.2" }
vote-commitment-tree-client = { path = "../vote-commitment-tree-client", version = "=0.5.2", features = ["http"] }

# Storage
rusqlite = { version = "0.37", features = ["bundled"] }

# Error handling
anyhow = "1"
thiserror = "2"
zeroize = "1"

# Single orchard node: every consumer resolves upstream `orchard` from
# crates.io at 0.14. The `unstable-voting-circuits` feature is required by
# integration tests in `zkp1.rs` (`Note::new`, `Note::dummy`,
# `Rho::from_nf_old`).
subtle = "2.6"
orchard = { version = "0.14", features = ["unstable-voting-circuits"] }
voting-circuits = "=0.8.0"
nonempty = "0.11"
zip32 = "0.2"
incrementalmerkletree = "0.8"

zcash_protocol = "0.9"
zcash_client_backend = { version = "0.23", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_client_sqlite = { version = "0.21", default-features = false, features = ["orchard"] }
zcash_keys = { version = "0.14", features = ["orchard"] }
pczt = { version = "0.7", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_primitives = "0.28"
uuid = "1.23.1"

[dev-dependencies]
secrecy = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
