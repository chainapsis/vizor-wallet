[package]
name = "zcash-voting-wallet-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
ff = "0.13"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
orchard = { workspace = true }
pasta_curves = "0.5"
rand = "0.8"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zcash_client_sqlite = { workspace = true }
zcash_keys = { workspace = true }
zcash_protocol = { workspace = true }
zcash_voting = { path = "../zcash_voting" }
zip32 = "0.2"
