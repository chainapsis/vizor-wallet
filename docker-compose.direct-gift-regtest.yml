name: vizor-gift-direct-claim-822
services:
  zcashd:
    image: ghcr.io/shieldedlabs/zero-zcashd@sha256:dce56bfbfc64a3d7c5562ccd59d70aed005bea8cd68dce063d687bef7ce181f5
    platform: linux/amd64
    entrypoint: [zcashd]
    command: ["-printtoconsole", "-conf=/etc/zcash/zcash.conf", "-datadir=/srv/zcash/.zcash", "-nuparams=37a5165b:500"]
    ports: ["127.0.0.1:18252:18232", "127.0.0.1:9267:9067"]
    volumes:
      - ./.regtest/zcashd:/srv/zcash/.zcash
      - ./scripts/ironwood-regtest/zcash.conf:/etc/zcash/zcash.conf:ro
  lightwalletd:
    image: vizor-ironwood-regtest-lightwalletd:latest
    platform: linux/amd64
    entrypoint: [lightwalletd]
    command: ["--no-tls-very-insecure", "--grpc-bind-addr", "0.0.0.0:9067", "--zcash-conf-path", "/etc/zcash/lightwalletd-zcash.conf", "--data-dir", "/var/lib/lightwalletd", "--log-file", "/dev/stdout"]
    depends_on: [zcashd]
    network_mode: service:zcashd
    volumes:
      - ./.regtest/zcashd:/srv/zcash/.zcash:ro
      - ./.regtest/lightwalletd:/var/lib/lightwalletd
      - ./scripts/ironwood-regtest/lightwalletd-zcash.conf:/etc/zcash/lightwalletd-zcash.conf:ro
