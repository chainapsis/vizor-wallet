name: Update mainnet chain tables

# Appends new entries to the compiled-in mainnet tables that let the wallet
# avoid asking lightwalletd about wallet-derived heights:
# - block times every 1,000 blocks, for birthday date and height conversion;
# - tree states every 10,000 blocks, where restored birthdays start scanning.
# A person reviews and merges each update, since the tables ship in the binary.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mainnet-chain-tables
  cancel-in-progress: false

env:
  BRANCH: automation/mainnet-chain-tables
  DATA_FILES: >-
    rust/src/wallet/block_times/mainnet_data.rs
    rust/src/wallet/tree_states/mainnet_data.rs
  GRPCURL_VERSION: 1.9.4
  GRPCURL_SHA256: 97e13d58d2733a0e62cd2571d1d5f0c02823f0d25282f08bddedf1ad9c5d1736

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install grpcurl
        run: |
          archive="grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/${archive}"
          echo "${GRPCURL_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" grpcurl
          sudo install -m 0755 grpcurl /usr/local/bin/grpcurl

      - name: Validate the checked-in tables
        run: |
          scripts/update-mainnet-block-times.py --check
          scripts/update-mainnet-tree-states.py --check

      - name: Append agreed entries
        id: update
        run: |
          block_times="$(scripts/update-mainnet-block-times.py)"
          echo "$block_times"
          tree_states="$(scripts/update-mainnet-tree-states.py)"
          echo "$tree_states"
          scripts/update-mainnet-block-times.py --check
          scripts/update-mainnet-tree-states.py --check
          {
            echo "block_times=$block_times"
            echo "tree_states=$tree_states"
          } >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2086 # DATA_FILES is a space-separated list.
          if git diff --quiet -- $DATA_FILES; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCK_TIMES: ${{ steps.update.outputs.block_times }}
          TREE_STATES: ${{ steps.update.outputs.tree_states }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          # shellcheck disable=SC2086 # DATA_FILES is a space-separated list.
          git add $DATA_FILES
          git commit -m "Update mainnet chain tables" \
            -m "Block times: $BLOCK_TIMES" -m "Tree states: $TREE_STATES"
          git push --force origin "$BRANCH"

          body="$(printf '%s\n\n- Block times: %s\n- Tree states: %s\n\n%s' \
            "Weekly update from \`scripts/update-mainnet-block-times.py\` and \`scripts/update-mainnet-tree-states.py\`." \
            "$BLOCK_TIMES" \
            "$TREE_STATES" \
            "Each new entry was confirmed by two independent lightwalletd endpoints, and the last existing entries were re-verified. Review and merge to ship the entries in the next release.")"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Update mainnet chain tables" --body "$body"
          fi
