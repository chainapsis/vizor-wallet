name: Update mainnet block times

# Appends new entries to the compiled-in mainnet block-time table that the
# wallet uses to convert birthday dates and heights without asking
# lightwalletd about wallet-derived heights. A person reviews and merges each
# update, since the table ships in the binary.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mainnet-block-times
  cancel-in-progress: false

env:
  BRANCH: automation/mainnet-block-times
  DATA_FILE: rust/src/wallet/block_times/mainnet_data.rs
  GRPCURL_VERSION: 1.9.4
  GRPCURL_SHA256: 97e13d58d2733a0e62cd2571d1d5f0c02823f0d25282f08bddedf1ad9c5d1736

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install grpcurl
        run: |
          archive="grpcurl_${GRPCURL_VERSION}_linux_x86_64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/fullstorydev/grpcurl/releases/download/v${GRPCURL_VERSION}/${archive}"
          echo "${GRPCURL_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" grpcurl
          sudo install -m 0755 grpcurl /usr/local/bin/grpcurl

      - name: Validate the checked-in table
        run: scripts/update-mainnet-block-times.py --check

      - name: Append agreed entries
        id: update
        run: |
          summary="$(scripts/update-mainnet-block-times.py)"
          echo "$summary"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          scripts/update-mainnet-block-times.py --check
          if git diff --quiet -- "$DATA_FILE"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add "$DATA_FILE"
          git commit -m "Update mainnet block-time table" -m "$SUMMARY"
          git push --force origin "$BRANCH"

          body="$(printf '%s\n\n%s\n\n%s' \
            "Weekly update from \`scripts/update-mainnet-block-times.py\`." \
            "$SUMMARY" \
            "Each new entry was confirmed by two independent lightwalletd endpoints, and the last existing entries were re-verified. Review and merge to ship the entries in the next release.")"
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Update mainnet block-time table" --body "$body"
          fi
