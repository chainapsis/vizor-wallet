services:
  zcashd:
    # Pin the exact runtime so a mutable `latest` tag cannot silently upgrade
    # an existing datadir and trigger a long wallet reindex during E2E setup.
    image: electriccoinco/zcashd@sha256:40cdcad6c32da8bedacf77caba149198c7674f79aeced4043128ffb3e967efba
    platform: linux/amd64
    entrypoint: ["zcashd"]
    command:
      - "-printtoconsole"
      - "-conf=/etc/zcash/zcash.conf"
      - "-datadir=/var/lib/zcash/.zcash"
    ports:
      - "18232:18232"
      - "9067:9067"
    volumes:
      - ./.regtest/zcashd:/var/lib/zcash/.zcash
      - ./scripts/regtest/zcash.conf:/etc/zcash/zcash.conf:ro

  lightwalletd:
    image: electriccoinco/lightwalletd@sha256:a3dfb04b4054b78ae3107dcc804c3a15a6e38d1f0dfcadeac48da482dd1d3448
    platform: linux/amd64
    entrypoint: ["lightwalletd"]
    command:
      - "--no-tls-very-insecure"
      - "--grpc-bind-addr"
      - "0.0.0.0:9067"
      - "--zcash-conf-path"
      - "/etc/zcash/lightwalletd-zcash.conf"
      - "--data-dir"
      - "/var/lib/lightwalletd"
      - "--log-file"
      - "/dev/stdout"
    depends_on:
      - zcashd
    network_mode: "service:zcashd"
    volumes:
      - ./.regtest/zcashd:/var/lib/zcash/.zcash:ro
      - ./.regtest/lightwalletd:/var/lib/lightwalletd
      - ./scripts/regtest/lightwalletd-zcash.conf:/etc/zcash/lightwalletd-zcash.conf:ro
