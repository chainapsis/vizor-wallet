[package]
name = "vote-commitment-tree"
version = "0.5.0"
edition = "2021"
description = "Append-only Poseidon Merkle tree for Vote Authority Notes and Vote Commitments in the Zcash shielded-voting protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[features]
default = ["upstream"]
upstream = ["imt-tree/upstream", "voting-crypto-deps/upstream", "voting-circuits/upstream"]
zakura = ["imt-tree/zakura", "voting-crypto-deps/zakura", "voting-circuits/zakura"]

[dependencies]
imt-tree = { version = "=0.3.0", default-features = false }
voting-crypto-deps = { workspace = true }
ff = "0.13"
anyhow = "1.0"
incrementalmerkletree = "0.8.1"
shardtree = "0.7"
lazy_static = "1"
libc = "0.2"

[dev-dependencies]
rand = "0.8"
voting-circuits = { workspace = true }
