[package]
name = "vote-commitment-tree"
version = "0.3.1"
edition = "2021"
description = "Append-only Poseidon Merkle tree for Vote Authority Notes and Vote Commitments in the Zcash shielded-voting protocol."
license = "MIT OR Apache-2.0"
repository = "https://github.com/valargroup/zcash_voting"
readme = "README.md"

[dependencies]
imt-tree = { git = "https://github.com/valargroup/vote-nullifier-pir.git", branch = "codex/halo2-gadgets-0.5-imt-tree", version = "=0.1.1" }
pasta_curves = "0.5"
ff = "0.13"
halo2_gadgets = { version = "=0.5.0", default-features = false }
anyhow = "1.0"
incrementalmerkletree = "0.8.1"
shardtree = "0.6"
lazy_static = "1"
libc = "0.2"

[dev-dependencies]
rand = "0.8"
orchard = { version = "0.14", features = ["unstable-voting-circuits"] }
voting-circuits = { git = "https://github.com/valargroup/voting-circuits.git", branch = "codex/orchard-0.14-halo2-0.5", version = "=0.7.0" }
